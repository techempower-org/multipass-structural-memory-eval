    expected_substrings:
      - "status=failed"
      - "never hard-error"
    shape: topical_mismatch
    why: "drawer describes rerank failure modes that silently fall back; query is about silent failure"

  - query: "How do we know the reranker is actually helping versus shuffling junk?"
    expected_drawers:
      - drawer_palace_daemon_problems_3d06faf7a5b3a53f63f738aa
      - drawer_palace_daemon_planning_9fe3724d32c28e67cd4179fe_chunk_000000
    expected_substrings:
      - "MRR +15"
      - "rerank_eval"
    shape: topical_mismatch
    why: "drawer reports the eval that measured the lift; query is about validation"

  - query: "What's our take on whether a different reranker model would be much better?"
