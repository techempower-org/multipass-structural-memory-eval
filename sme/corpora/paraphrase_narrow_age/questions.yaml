    shape: canary
    why: "no drawer ties realmwatch combat-ward to CRDT decisions in this window; retrieval should noisy-miss or surface low-similarity hits"

  - query: "What's the verdict on ms-marco-MiniLM-L-24-v2 from our last sweep?"
    expected_drawers: []
