      - drawer_palace_daemon_planning_a1e24a99c2084cfb1d0d9922_chunk_000000
    expected_substrings:
      - "TinyBERT"
      - "FlashRank"
    shape: vocab_mismatch
    why: "drawer uses 'ms-marco-TinyBERT-L-2-v2 nano' + 'FlashRank cross-encoder'; query says 'small lightweight rescorer'"

  - query: "How did we finally get the entity graph populated from existing data?"
