      - drawer_familiar_realm_watch_references_5c202e79e7780d760090d45a
    expected_substrings:
      - "vram_mb"
      - "0.92"
    shape: vocab_mismatch
    why: "drawer uses 'slot picker VRAM accounting' + 'gpu_total_mb'; query says 'memory budget'"

  - query: "Why did we change which Apache plugin Postgres runs?"
    expected_drawers:
      - drawer_storyvox_references_1ee9f8bd860a44a0a54790f9
    expected_substrings:
      - "AGE 1.6.0"
      - "apache/age"
    shape: vocab_mismatch
    why: "drawer uses 'apache/age:release_PG16_1.6.0' container ref; query says 'Apache plugin'"

  - query: "What happens when too many things grab the work queue at the same time?"
