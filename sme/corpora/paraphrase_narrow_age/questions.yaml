# Narrow-age paraphrase corpus — every target drawer created within 7 days
# of corpus authorship (2026-05-21 .. 2026-05-28).
#
# Why this sister corpus exists
# -----------------------------
# The 51-question parent corpus at
#     familiar.realm.watch/tests/eval/paraphrase_questions.yaml
# pulls target drawers from a ~2-month spread (2026-04-23 .. 2026-05-28).
# When familiar's retrieval pipeline applies temporal-decay scoring on top
# of palace-side rerank, the per-drawer multipliers vary by an order of
# magnitude across that spread. The decay sort then overwrites the
# rerank scores, and the rerank-on vs rerank-off A/B returns near-
# identical retrieval orderings (Aurora's PR #94 diagnosis on
# techempower-org/multipass-structural-memory-eval).
#
# In this corpus every target drawer was written within a single 7-day
# window. With ages bunched, the decay multipliers stay roughly uniform
# (within ~7%), so the rerank score actually decides the order and the
# A/B becomes informative again. Same construction trick lets us see
# modality lifts (vector vs BM25 vs graph) without recency masking them.
#
# Schema matches paraphrase_questions.yaml (consumed by
# familiar.realm.watch/tests/eval/run_paraphrase_probe.py):
#   query              — paraphrase-stressed question
#   expected_drawers   — list of drawer IDs (any-of match)
#   expected_substrings — list of strings; case-insensitive substring
#                         match against retrieved content_snippet
#   shape              — one of {vocab_mismatch, temporal, topical_mismatch,
#                         cross_project, canary, contradiction, recency}
#   why                — what the probe is measuring
#
# Sourcing: drawer IDs and content snippets verified via
# mempalace_search MCP on 2026-05-28; each entry's created_at lies in
# [2026-05-21, 2026-05-28]. A drawer that gets garbage-collected from
# the live palace won't fail the probe — it just can't contribute a
# hit, and the question still has expected_substrings as a fallback.

version: paraphrase-narrow-age-v0.1
window_start: 2026-05-21
window_end: 2026-05-28
authored: 2026-05-28
authored_by: lyra
parent_corpus: familiar.realm.watch/tests/eval/paraphrase_questions.yaml
parent_issue: https://github.com/techempower-org/familiar.realm.watch/issues/73

questions:
