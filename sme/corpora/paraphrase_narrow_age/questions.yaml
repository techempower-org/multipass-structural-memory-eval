      - drawer_memorypalace_architecture_9c11798d926fcfe4acc1ada2
    expected_substrings:
      - "barely moves the needle"
      - "1.3pp"
    shape: contradiction
    why: "drawer says no — only 1.3pp within the 256d subfamily"

  - query: "Did the rerank improve every single query in the eval?"
    expected_drawers:
      - drawer_palace_daemon_planning_9fe3724d32c28e67cd4179fe_chunk_000000
    expected_substrings:
      - "regression"
      - "1.0→0.909"
    shape: contradiction
    why: "drawer documents one R@5 regression; answer is no"

  # ── canary: question whose correct answer is 'I don't know' / 'not in palace' ──
